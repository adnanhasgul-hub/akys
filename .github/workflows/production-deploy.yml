name: Manual production deployment (OIDC)
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        required: true
        options: [hosting, rules, indexes]
      expected_sha:
        description: Reviewed exact main HEAD (40 hex characters)
        required: true
        type: string
      confirmation:
        description: Type akys-d708a
        required: true
        type: string
      inspection_run:
        description: Successful read-only inspection run ID reviewed by approver
        required: true
        type: string
      backup_reference:
        description: Reviewed backup/restore evidence reference (no secrets)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: akys-production-change
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'adnanhasgul-hub/akys' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check reviewed revision and explicit confirmation
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          INSPECTION_RUN: ${{ inputs.inspection_run }}
          BACKUP_REFERENCE: ${{ inputs.backup_reference }}
        run: python3 tool/deployment/guard.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: npm ci --prefix tool/firestore-tests --no-audit --no-fund
      - run: npm test --prefix tool/firestore-tests
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - if: inputs.target == 'hosting'
        run: |
          flutter build web --release
          bash tool/solver_v2/web/build_worker.sh build/web
      - if: inputs.target == 'hosting'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reviewed-web-${{ github.sha }}
          path: build/web/
          retention-days: 7
          if-no-files-found: error
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-${{ inputs.target }}
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify inspection belongs to this exact reviewed revision
        env:
          GH_TOKEN: ${{ github.token }}
          INSPECTION_RUN: ${{ inputs.inspection_run }}
        run: |
          gh api "repos/adnanhasgul-hub/akys/actions/runs/$INSPECTION_RUN" --jq '{conclusion,head_sha,path,event,head_branch,repository:.repository.full_name}' > /tmp/inspection-run.json
          python3 tool/deployment/guard.py --inspection /tmp/inspection-run.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --prefix tool/firestore-tests --no-audit --no-fund
      - if: inputs.target == 'hosting'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: reviewed-web-${{ github.sha }}
          path: build/web/
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          project_id: akys-d708a
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          cleanup_credentials: true
      - name: Check active Rules before client publication
        if: inputs.target == 'hosting'
        env:
          NODE_PATH: tool/firestore-tests/node_modules
        run: node tool/firestore-tests/verify-production-rules.cjs
      - if: inputs.target == 'hosting'
        run: tool/firestore-tests/node_modules/.bin/firebase deploy --only hosting --project akys-d708a --non-interactive
      - if: inputs.target == 'rules'
        run: tool/firestore-tests/node_modules/.bin/firebase deploy --only firestore:rules --project akys-d708a --non-interactive
      - if: inputs.target == 'rules'
        env:
          NODE_PATH: tool/firestore-tests/node_modules
        run: node tool/firestore-tests/verify-production-rules.cjs
      - if: inputs.target == 'indexes'
        env:
          NODE_PATH: tool/firestore-tests/node_modules
        run: node tool/deployment/indexes.cjs
